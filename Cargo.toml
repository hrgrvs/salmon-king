[package]
name = "salmon-king"
version = "1.0.0"
edition = "2021"
description = "A single-player TUI set-net camp sim on Kodiak Island, Alaska."
license = "MIT"
authors = ["Salmon King"]
readme = "README.md"
keywords = ["game", "tui", "alaska", "kodiak", "salmon", "setnet"]
categories = ["games", "command-line-utilities"]
repository = "https://github.com/hrgrvs/salmon-king"
rust-version = "1.85"

[[bin]]
name = "salmon-king"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
rand = { version = "0.8", features = ["std"] }
ratatui = "0.29"
