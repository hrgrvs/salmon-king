[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salmon-king"
version = "1.0.0"
description = "A single-player TUI set-net camp sim on Kodiak Island, Alaska."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Salmon King" }]
license = { text = "MIT" }
keywords = ["game", "tui", "textual", "alaska", "kodiak", "salmon", "setnet"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "textual>=1.0.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
salmon-king = "salmon_king.__main__:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["salmon_king*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
